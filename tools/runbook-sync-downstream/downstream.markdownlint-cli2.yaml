# Vendored copy of the markdownlint configuration used by the downstream
# repository, openshift/runbooks:
#
#   https://github.com/openshift/runbooks/blob/master/.markdownlint-cli2.yaml
#
# The runbook-preview workflow lints the generated downstream text with this
# config so that MD013 violations are caught on the upstream pull request,
# rather than days later on the nightly sync PR that runbook-sync-downstream
# opens against openshift/runbooks (where `ci/prow/markdownlint` enforces it).
#
# This differs from the repository-root .markdownlint-cli2.yaml in one rule:
# downstream enforces `line-length` at 80 for prose, while upstream disables
# it. Keep the rest in sync with the URL above when it changes.

config:
  # forematter metadata seems to trigger this
  single-title: false

  # hard tabs are used when pasting go example code into files
  no-hard-tabs: false

  # we commonly paste bare urls in the middle of paragraphs
  no-bare-urls: false

  # really, this is a rule?
  commands-show-output: false

  # Enforced downstream: 80 characters for prose, code blocks exempt.
  line-length:
    line_length: 80
    code_blocks: false

  # Sometimes we repeat headings, and it's easier to just turn those
  # into emphasis
  no-emphasis-as-heading: false

  # We only publish HTML, so allow all HTML inline.
  no-inline-html: false

  ## Rules we may want to turn on later, but that will require editing
  ## existing files:

  # We tend to use `*` instead of `-` for list bullets but we aren't
  # consistent, even within a single file. Ideally we would want
  # `style: consistent`
  ul-style: false

  # We have at least one # document that breaks up a numbered list
  # with headings.  Ideally we would set `style: one_or_ordered`.
  ol-prefix: false

  # Vertical whitespace helps the reader, so we should turn these on
  # again when someone has time to fix our existing files.
  blanks-around-fences: false
  blanks-around-headings: false
  blanks-around-lists: false
  single-trailing-newline: false
  no-multiple-blanks: false

  # Allow duplicate headings with different parents.
  no-duplicate-heading:
    siblings_only: true

  # Disabling MD059/descriptive-link-text.
  MD059: false
