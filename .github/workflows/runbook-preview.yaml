name: Runbook Downstream Preview

on:
  pull_request:
    paths:
      - 'docs/runbooks/**.md'
      - 'tools/runbook-sync-downstream/**'
      - '.github/workflows/runbook-preview.yaml'

permissions:
  contents: read

jobs:
  preview:
    name: Generate downstream preview
    if: (github.repository == 'kubevirt/monitoring')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Build preview tool
        run: make build-runbook-preview

      - name: Get changed runbook files
        id: changed-files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'docs/runbooks/*.md')

          if [ -z "$FILES" ]; then
            FILES=$(ls docs/runbooks/*.md)
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ -z "$FILES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate downstream preview
        if: steps.changed-files.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          mkdir -p "${RUNNER_TEMP}/downstream-preview"
          echo "$CHANGED_FILES" | while read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              tools/runbook-sync-downstream/_out/runbook-preview \
                -output-dir "${RUNNER_TEMP}/downstream-preview" "$file" >/dev/null
            fi
          done

          for preview in "${RUNNER_TEMP}"/downstream-preview/*.md; do
            [ -e "$preview" ] || continue
            echo "============================================"
            echo "Preview: $(basename "$preview")"
            echo "============================================"
            cat "$preview"
            echo ""
          done

      - name: Lint downstream preview
        if: steps.changed-files.outputs.has_changes == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes markdownlint-cli2@0.13.0 \
            --config "${GITHUB_WORKSPACE}/tools/runbook-sync-downstream/downstream.markdownlint-cli2.yaml" \
            "${RUNNER_TEMP}/downstream-preview/*.md"
